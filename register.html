{% extends 'base.html' %}{% block content %}<div class="panel"><h2>Register</h2><form method="post"><input name="first_name" placeholder="First name" required><input name="last_name" placeholder="Last name" required><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password" required><input type="password" name="confirm" placeholder="Confirm password" required><input name="referral" value="{{request.args.get('ref','')}}" placeholder="Referral code (optional)"><label><input type="checkbox" name="terms" required> I agree to the terms and conditions</label><button class="btn">Continue</button></form></div>{% endblock %}
